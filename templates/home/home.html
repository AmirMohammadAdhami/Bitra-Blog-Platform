{% extends "base.html" %}
{% load static %}

{% block title %}Bitra — The Daily Broadsheet{% endblock %}

{% block content %}
<div id="front" data-front>
  <!-- Front page is rendered from the API by front.js -->
  <section class="frontpage" aria-label="Lead stories">
    <div class="frontpage__left rail" aria-hidden="true">
      <div class="skeleton"><div class="sk-line w-60"></div><div class="sk-line w-80"></div><div class="sk-line w-40"></div></div>
    </div>
    <div class="frontpage__mid">
      <div class="skeleton" style="min-height:14rem"><div class="sk-line w-40"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div></div>
    </div>
    <div class="frontpage__right rail" aria-hidden="true">
      <div class="skeleton"><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
    </div>
  </section>
</div>

<!-- Popular Authors (rendered by front.js — outside [data-front] so UI.clear() doesn't wipe it) -->
<section class="popular-authors" data-popular-authors aria-label="Popular Authors">
  <div class="shell">
    <div class="section-head">
      <span class="flag">Popular Authors</span>
    </div>
    <div class="popauth-grid" data-popauth-grid>
      <div class="popauth-card skeleton"><div class="sk-line" style="width:64px;height:64px;border-radius:50%"></div><div class="sk-line w-60" style="margin-top:.8rem"></div><div class="sk-line w-40" style="margin-top:.4rem"></div></div>
      <div class="popauth-card skeleton"><div class="sk-line" style="width:64px;height:64px;border-radius:50%"></div><div class="sk-line w-60" style="margin-top:.8rem"></div><div class="sk-line w-40" style="margin-top:.4rem"></div></div>
      <div class="popauth-card skeleton"><div class="sk-line" style="width:64px;height:64px;border-radius:50%"></div><div class="sk-line w-60" style="margin-top:.8rem"></div><div class="sk-line w-40" style="margin-top:.4rem"></div></div>
      <div class="popauth-card skeleton"><div class="sk-line" style="width:64px;height:64px;border-radius:50%"></div><div class="sk-line w-60" style="margin-top:.8rem"></div><div class="sk-line w-40" style="margin-top:.4rem"></div></div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/front.js' %}"></script>
{% endblock %}
