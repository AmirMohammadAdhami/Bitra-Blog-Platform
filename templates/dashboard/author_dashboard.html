{% extends "dashboard/_shell.html" %}
{% load static %}

{% block title %}Writers’ desk — Bitra{% endblock %}

{% block dash %}
<div class="dash__head">
  <h1>Writers’ desk</h1>
  <span class="wire" data-count></span>
  <a class="btn btn--sm btn--ink dash__headcta" href="{% url 'accounts:dashboard_write' %}" data-new hidden>Start a story</a>
</div>
<div class="desk-stats" data-desk-stats>
  <div class="desk-stat">
    <span class="desk-stat__num" data-stat-articles>—</span>
    <span class="desk-stat__label">Articles</span>
  </div>
  <div class="desk-stat">
    <span class="desk-stat__num" data-stat-published>—</span>
    <span class="desk-stat__label">Published</span>
  </div>
  <div class="desk-stat">
    <span class="desk-stat__num" data-stat-views>—</span>
    <span class="desk-stat__label">Views</span>
  </div>
  <div class="desk-stat">
    <span class="desk-stat__num" data-stat-likes>—</span>
    <span class="desk-stat__label">Likes</span>
  </div>
  <div class="desk-stat">
    <span class="desk-stat__num" data-stat-bookmarks>—</span>
    <span class="desk-stat__label">Bookmarks</span>
  </div>
</div>
<div data-desk>
  <div class="note-block"><p>Opening your desk…</p></div>
</div>
{% endblock %}

{% block dash_scripts %}
<script src="{% static 'js/dash_desk.js' %}"></script>
{% endblock %}
