{% extends "base.html" %}
{% load static %}

{% block title %}404 - Page Not Found | Bitra{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-bg">
        <div class="gradient-mesh gradient-mesh-sm"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">
                <span class="glitch" data-text="404">404</span>
            </div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-text">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

            <div class="error-search">
                <input type="text" class="error-search-input" placeholder="Search for articles...">
                <button class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
            </div>

            <div class="error-actions">
                <a href="/" class="btn btn-primary btn-lg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Return Home
                </a>
                <a href="/articles/" class="btn btn-glass btn-lg">Browse Articles</a>
            </div>
        </div>

        <div class="error-visual">
            <div class="circuit-board">
                <svg width="300" height="300" viewBox="0 0 300 300" fill="none">
                    <circle cx="150" cy="150" r="100" stroke="#66BB6A" stroke-width="1" opacity="0.3" stroke-dasharray="5 5"/>
                    <circle cx="150" cy="150" r="70" stroke="#A5D6A7" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>
                    <circle cx="150" cy="150" r="40" stroke="#66BB6A" stroke-width="1" opacity="0.5"/>
                    <line x1="150" y1="50" x2="150" y2="250" stroke="#66BB6A" stroke-width="1" opacity="0.2"/>
                    <line x1="50" y1="150" x2="250" y2="150" stroke="#66BB6A" stroke-width="1" opacity="0.2"/>
                    <circle cx="150" cy="150" r="8" fill="#66BB6A" opacity="0.8">
                        <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="80" cy="80" r="4" fill="#A5D6A7" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="220" cy="80" r="4" fill="#A5D6A7" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="80" cy="220" r="4" fill="#66BB6A" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.1s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="220" cy="220" r="4" fill="#66BB6A" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
        </div>
    </div>
</section>
{% endblock %}
