{% comment %}
Rendered dynamically on the client to match DRF's PageNumberPagination
response shape: { count, next, previous, results }.
See: static/js/render.js -> BitraRender.pagination(container, options)
Usage:
    <div id="paginationControls" data-pagination></div>
    <script>
      BitraRender.pagination(document.getElementById('paginationControls'), {
        count: data.count, pageSize: 10, currentPage: 1,
        onPageClick: function (page) { loadArticles(page); }
      });
    </script>
{% endcomment %}
