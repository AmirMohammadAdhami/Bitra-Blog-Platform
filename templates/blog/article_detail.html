{% extends "base.html" %}
{% load static %}

{% block title %}Story — Bitra{% endblock %}

{% block content %}
<article class="article" data-article>
  <div class="skeleton" style="min-height:20rem">
    <div class="sk-line w-40"></div>
    <div class="sk-line w-80"></div>
    <div class="sk-line w-60"></div>
    <div class="sk-line w-80"></div>
  </div>
</article>

<section class="comments" data-comments hidden>
  <div class="section-head"><span class="flag">Letters</span></div>
  <div data-comment-gate></div>
  <div data-comment-list></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/article.js' %}"></script>
{% endblock %}
