{% extends "base.html" %}
{% load static %}

{% block title %}All Stories — Bitra{% endblock %}

{% block content %}
<div class="pagehead">
  <h1>The Index</h1>
  <p class="wire" style="margin-top:.6rem;text-transform:none;letter-spacing:.04em;">
    Every story, filed and sorted.
  </p>
</div>

<div class="filterbar" data-filterbar>
  <div class="chips" data-chips>
    <button class="chip" data-cat="" aria-pressed="true">All</button>
  </div>
  <label class="search">
    <span class="search__ico" aria-hidden="true">⌕</span>
    <input type="search" placeholder="Search headlines…" data-search aria-label="Search stories">
  </label>
</div>

<div data-index>
  <div class="index">
    <div class="index__row skeleton"><span class="index__num">00</span><div><div class="sk-line w-80"></div><div class="sk-line w-60"></div></div><div class="index__aside"></div></div>
    <div class="index__row skeleton"><span class="index__num">00</span><div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div><div class="index__aside"></div></div>
    <div class="index__row skeleton"><span class="index__num">00</span><div><div class="sk-line w-80"></div><div class="sk-line w-40"></div></div><div class="index__aside"></div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/index.js' %}"></script>
{% endblock %}
