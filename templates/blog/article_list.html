{% extends "base.html" %}
{% load static %}

{% block title %}Articles | Bitra{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <span class="section-tag">Our Blog</span>
        <h1 class="page-title">All Articles</h1>
        <p class="page-subtitle">Discover the latest insights, tutorials, and analysis from the world of technology.</p>
    </div>
</section>

<section class="section articles-page">
    <div class="container">
        <div class="articles-toolbar">
            <div class="category-filters" id="categoryFilters" data-loading="true">
                <button class="filter-btn active" data-category-slug="">All</button>
            </div>
            <div class="search-filter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" placeholder="Search articles..." class="search-filter-input" id="articleSearchInput">
            </div>
        </div>

        <div class="articles-grid articles-grid-3" id="articlesGrid" data-loading="true">
            <p class="loading-text">Loading articles&hellip;</p>
        </div>

        <div id="articlesPagination"></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/article_list.js' %}"></script>
{% endblock %}
