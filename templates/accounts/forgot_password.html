{% extends "base.html" %}
{% load static %}

{% block title %}Forgot Password | Bitra{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-bg">
        <div class="gradient-mesh gradient-mesh-sm"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#forgot-gradient)"/>
                        <path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="forgot-gradient" x1="0" y1="0" x2="32" y2="32">
                                <stop stop-color="#66BB6A"/>
                                <stop offset="1" stop-color="#2E7D32"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </a>
                <div class="auth-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        <circle cx="12" cy="16" r="1"/>
                    </svg>
                </div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">No worries! Enter your email and we'll send you a reset link.</p>
            </div>

            <form class="auth-form" id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <path d="M22 6l-10 7L2 6"/>
                        </svg>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required name="email">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotSubmitBtn">Send Reset Code</button>
            </form>

            <p class="auth-footer">
                <a href="{% url 'accounts:login' %}" class="form-link form-link-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back to Login
                </a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/forgot_password.js' %}"></script>
{% endblock %}
