{% extends "base.html" %}
{% load static %}

{% block title %}Sign in — Bitra{% endblock %}

{% block content %}
<div class="coupon-wrap">
  <div class="coupon">
    <div class="coupon__flagrow"><span class="flag">Subscribers</span></div>
    <h1 class="coupon__title">Sign In</h1>
    <p class="coupon__sub wire" style="text-transform:none;letter-spacing:.03em;">Welcome back to the newsroom.</p>

    <form data-login novalidate>
      <div class="form-note" data-note role="alert"></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <div class="form__foot">
        <button class="btn btn--ink btn--block" type="submit" data-submit>Sign in</button>
      </div>
      <p class="form__alt">
        <a href="/accounts/forgot-password/" style="font-size:.78rem;">Forgot your password?</a>
        &nbsp;·&nbsp;
        No account yet? <a href="/accounts/register/">Open one free →</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
