{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password — Bitra{% endblock %}

{% block content %}
<div class="coupon-wrap">
  <div class="coupon">
    <div class="coupon__flagrow"><span class="flag">Account Recovery</span></div>
    <h1 class="coupon__title">Set a New Password</h1>
    <p class="coupon__sub wire" style="text-transform:none;letter-spacing:.03em;">Choose a strong password with at least 8 characters.</p>

    <form data-reset novalidate>
      <div class="form-note" data-note role="alert"></div>
      <div class="field">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8" placeholder="Re-enter your password">
      </div>
      <div class="form__foot">
        <button class="btn btn--ink btn--block" type="submit" data-submit>Reset password</button>
      </div>
      <p class="form__alt">
        <a href="/accounts/login/">← Back to sign in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/reset_password.js' %}"></script>
{% endblock %}
