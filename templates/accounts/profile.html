{% extends "base.html" %}
{% load static %}

{% block title %}My Profile | Bitra{% endblock %}

{% block content %}
<section class="dashboard-page">
    <div class="container">
        <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-avatar">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h3 class="sidebar-username">John Doe</h3>
                    <p class="sidebar-email">john@example.com</p>
                </div>
                <nav class="sidebar-nav">
                    <a href="/dashboard/profile/" class="sidebar-link active">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Profile
                    </a>
                    <a href="/dashboard/comments/" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        My Comments
                    </a>
                    <a href="/dashboard/author-request/" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                        </svg>
                        Author Request
                    </a>
                    <a href="/dashboard/likes/" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        Likes
                    </a>
                    <a href="/dashboard/bookmarks/" class="sidebar-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                        </svg>
                        Bookmarks
                    </a>
                </nav>
            </aside>

            <main class="dashboard-content">
                <div class="dashboard-header">
                    <h1 class="dashboard-title">Profile Settings</h1>
                    <p class="dashboard-subtitle">Manage your account information</p>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar-large">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <button class="btn btn-outline btn-sm">Change Photo</button>
                    </div>

                    <form class="profile-form">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label for="first_name" class="form-label">First Name</label>
                                <input type="text" id="first_name" class="form-input" value="John">
                            </div>
                            <div class="form-group">
                                <label for="last_name" class="form-label">Last Name</label>
                                <input type="text" id="last_name" class="form-input" value="Doe">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-input" value="johndoe">
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-input" value="john@example.com">
                        </div>

                        <div class="form-group">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea id="bio" class="form-textarea" rows="4">Technology enthusiast and software developer. Writing about the future of tech.</textarea>
                        </div>

                        <div class="form-group">
                            <label for="website" class="form-label">Website</label>
                            <input type="url" id="website" class="form-input" placeholder="https://yourwebsite.com">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <button type="button" class="btn btn-ghost">Cancel</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</section>
{% endblock %}
