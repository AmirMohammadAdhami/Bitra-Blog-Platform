{% extends "base.html" %}
{% load static %}

{% block title %}Subscribe — Bitra{% endblock %}

{% block content %}
<div class="coupon-wrap">
  <div class="coupon">
    <div class="coupon__flagrow"><span class="flag">Free Subscription</span></div>
    <h1 class="coupon__title">Open an Account</h1>
    <p class="coupon__sub wire" style="text-transform:none;letter-spacing:.03em;">Save stories, write letters, join the desk.</p>

    <form data-register novalidate>
      <div class="form-note" data-note role="alert"></div>
      <div class="field">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required placeholder="Ada Lovelace">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="ada" maxlength="30">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="At least 8 characters">
      </div>
      <div class="form__foot">
        <button class="btn btn--ink btn--block" type="submit" data-submit>Create account</button>
      </div>
      <p class="form__alt">
        Already a subscriber? <a href="/auth/login/">Sign in →</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
