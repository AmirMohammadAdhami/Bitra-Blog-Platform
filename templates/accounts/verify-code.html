{% extends "base.html" %}
{% load static %}

{% block title %}Verify Code — Bitra{% endblock %}

{% block content %}
<div class="coupon-wrap">
  <div class="coupon">
    <div class="coupon__flagrow"><span class="flag">Account Recovery</span></div>
    <h1 class="coupon__title">Enter Your Code</h1>
    <p class="coupon__sub wire" style="text-transform:none;letter-spacing:.03em;">We sent a 6-digit verification code to <strong data-email-display></strong>. It expires in 10 minutes.</p>

    <form data-verify novalidate>
      <div class="form-note" data-note role="alert"></div>
      <div class="field">
        <label for="code">Verification code</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required placeholder="000000" autofocus style="text-align:center;font-family:var(--wire);font-size:1.6rem;letter-spacing:.35em;">
      </div>
      <div class="form__foot">
        <button class="btn btn--ink btn--block" type="submit" data-submit>Verify code</button>
      </div>
      <p class="form__alt">
        <button type="button" class="util__link" data-resend style="background:none;border:0;padding:0;font-family:var(--wire);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;">Resend code</button>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/verify_code.js' %}"></script>
{% endblock %}
